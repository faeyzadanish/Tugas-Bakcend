<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Barang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">INVENTORY CONTROL</p>
        <h1>Manajemen Barang</h1>
        <p class="subtitle">Pantau stok, harga, dan perubahan inventaris dalam satu tempat.</p>
      </div>
      <div class="status-pill"><span class="status-dot"></span> Sistem aktif</div>
    </header>

    <section class="summary-grid" aria-label="Ringkasan inventaris">
      <article class="summary-card accent-card">
        <span>Total item</span>
        <strong id="total-item">0</strong>
      </article>
      <article class="summary-card">
        <span>Total unit</span>
        <strong id="total-unit">0</strong>
      </article>
      <article class="summary-card">
        <span>Nilai inventaris</span>
        <strong id="total-value">Rp0</strong>
      </article>
    </section>

    <section class="content-grid">
      <section class="panel form-panel">
        <div class="panel-heading">
          <div>
            <p class="section-label">DATA BARANG</p>
            <h2 id="form-title">Tambah barang</h2>
          </div>
          <span class="panel-number">01</span>
        </div>
        <form id="barang-form">
          <input type="hidden" id="barang-id">
          <label for="nama_barang">Nama barang</label>
          <input type="text" id="nama_barang" name="nama_barang" placeholder="Contoh: Keyboard mekanikal" required maxlength="120">

          <div class="field-row">
            <div>
              <label for="jumlah">Jumlah</label>
              <input type="number" id="jumlah" name="jumlah" min="0" step="1" placeholder="0" required>
            </div>
            <div>
              <label for="harga">Harga satuan</label>
              <input type="number" id="harga" name="harga" min="0" step="0.01" placeholder="0" required>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="button primary" id="submit-button">Simpan barang</button>
            <button type="button" class="button secondary hidden" id="cancel-button">Batal edit</button>
          </div>
          <p class="message" id="form-message" role="status"></p>
        </form>
      </section>

      <section class="panel inventory-panel">
        <div class="panel-heading">
          <div>
            <p class="section-label">DAFTAR INVENTARIS</p>
            <h2>Barang tersimpan</h2>
          </div>
          <span class="panel-number">02</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nama barang</th>
                <th>Jumlah</th>
                <th>Harga</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="barang-list">
              <tr><td colspan="4" class="empty-state">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
